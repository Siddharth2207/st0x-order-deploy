# ---------------------------------------------------------------------------
# Strategy definitions
#
# Each strategy has a list of orders. One card is rendered per order in the UI.
# strategyType: the key passed to registry.getGui() — matches the .rain file name
# deploymentKey: the deployment within that strategy file
# selectTokens:  { guiTokenKey: "0xAddress" }
# fieldValues:   { bindingName: "value" }
# deposits:      { guiTokenKey: "humanAmount" } — "0" entries are skipped
# ---------------------------------------------------------------------------
strategies:
  # ── wtMSTR / USDC ─────────────────────────────────────────────────────────
  - name: "wtMSTR/USDC"
    orders:
      - label: "Buy wtMSTR"
        description: "spend USDC → receive wtMSTR at Pyth price"
        strategyType: "fixed-spread"
        deploymentKey: "base-pyth-inv"
        selectTokens:
          output: *base_usdc
          input: *wt_mstr
        fieldValues:
          pyth-pair: *feed_mstr
          baseline-multiplier: "1.001"
          oracle-price-timeout: "300"
        deposits:
          output: "0"
      - label: "Sell wtMSTR"
        description: "sell wtMSTR → receive USDC at Pyth price"
        strategyType: "fixed-spread"
        deploymentKey: "base-pyth"
        selectTokens:
          output: *wt_mstr
          input: *base_usdc
        fieldValues:
