# ---------------------------------------------------------------------------
# Strategy definitions
#
# Each strategy has a list of orders. One card is rendered per order in the UI.
# strategyType: the key passed to registry.getGui() — matches the .rain file name
# deploymentKey: the deployment within that strategy file
# selectTokens:  { guiTokenKey: "0xAddress" }
# fieldValues:   { bindingName: "value" }
# deposits:      { guiTokenKey: "humanAmount" } — "0" entries are skipped
# ---------------------------------------------------------------------------
strategies:
  # ── st0x fixed spread (oracle server) ─────────────────────────────────────
  - name: "st0x-fixed-spread"
    orders:
      - label: "Buy wtSPYM (5m)"
        description: "spend USDC → receive wtSPYM (max-staleness 300, multiplier 1.0002)"
        strategyType: "st0x-fixed-spread"
        deploymentKey: "base-st0x"
        selectTokens:
          output: *base_usdc
          input: *wt_spym
        fieldValues:
          baseline-multiplier: "1.0002"
          min-price: "0.01"
          max-price: "100000"
          max-staleness: "300"
          future-timestamp-buffer: "20"
        deposits:
          output: "0"
        vaultIds:
          output:
            output: *vault_usdc
          input:
            input: *vault_spym
      - label: "Sell wtSPYM (5m)"
        description: "sell wtSPYM → receive USDC (max-staleness 300, multiplier 1.0002)"
        strategyType: "st0x-fixed-spread"
        deploymentKey: "base-st0x"
        selectTokens:
          output: *wt_spym
